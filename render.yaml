services:
  - type: web
    name: climate-hazard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: climate_hazard
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT
        value: 10/minute
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: PYTHON_VERSION
        value: "3.12.8"
